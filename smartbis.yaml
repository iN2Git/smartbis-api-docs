            example:
              description: Food & Beverage
      responses:
        '201':
          description: Category created successfully
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Administrator access is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '500':
          description: Category could not be created safely.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /categories/{category_id}:
    patch:
      tags:
        - Categories
      summary: Update Category
      operationId: patchCategory
      description: |
        Partially updates a category. Send `active: true` to activate it or `active: false` to deactivate it.
        Deactivation is logical and records the status change time; it does not delete the category or rewrite existing
        reward and partner references. Administrator access is required.
      security:
        - bearerAuth: []
      parameters:
        - name: category_id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryRequest'
            examples:
              rename:
                value:
                  description: Food & Beverage
              deactivate:
                value:
                  active: false
              activate:
                value:
                  active: true
      responses:
        '200':
          description: Category updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Administrator access is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Category not found in the authenticated company.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Invalid field, value, or idempotency key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Category could not be updated safely.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /vouchers/manual-redemptions:
    post:
      tags:
        - Vouchers
      summary: Perform Manual Voucher Redemption
      operationId: postManualVoucherRedemption
      description: |
        Performs the existing Smartbis manual redemption flow. This is not a generic voucher issuance endpoint.
        Smartbis verifies that manual redemption is enabled, resolves the store from the authenticated operator,
        validates the active customer and available balance, creates the voucher, records the matching negative
        `Resgate` transaction, updates the customer's cached balance, and commits all changes atomically.

        When the company uses per-partner balances, sufficiency is checked in the resolved store. Otherwise the global
        customer balance is used. Point-based programs accept whole-number amounts; cashback programs accept two
        decimal places. Voucher validity and minimum-order rules come from the company configuration.

        The voucher is created as already completed and validated by the operator, exactly like the manual operation in
        the panel. The operation is irreversible: an issued manual-redemption voucher cannot be edited, cancelled, or
        reversed through the API. The operator must have voucher permission for exactly one store; administrators use
        the configured main store.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualVoucherRedemptionRequest'
            example:
              customer_id: 12345
              amount: 100
      responses:
        '201':
          description: Manual voucher redemption completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManualVoucherRedemptionResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Manual redemption is disabled or the operator lacks voucher permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Active customer not found or not visible to the operator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Insufficient balance, ambiguous store permission, missing administrator store, or concurrent state change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Invalid amount, customer, field, or idempotency key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: The voucher and balance transaction could not be committed atomically.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /vouchers:
    get:
      tags:
        - Vouchers
      summary: List Vouchers
      operationId: getListVouchers
      description: |
        Requires permission to validate vouchers. Operators receive only vouchers issued by stores where they have that
        permission. Administrators can list vouchers across the company.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            example: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            example: 50
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The operator does not have permission to validate vouchers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /vouchers/{voucher_code}/validate:
    post:
      tags:
        - Vouchers
      summary: Validate Voucher
      operationId: postValidateVoucher
      description: |
        Requires voucher validation permission for the store that issued the voucher. An operator cannot validate their own
        non-cashback voucher. Reward vouchers and cashback vouchers are supported, subject to their expiration and
        the store's configured redemption limits. A voucher can be validated only once.
      security:
        - bearerAuth: []
      parameters:
        - name: voucher_code
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Missing store permission, or the operator attempted to validate their own voucher.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Voucher not found in an authorized store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Voucher already validated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Voucher validation could not be committed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /webhooks:
    get:
      tags: [Webhooks]
      summary: List webhook endpoints
      operationId: getWebhooks
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Webhook endpoints returned, content: {application/json: {schema: {$ref: '#/components/schemas/WebhookListResponse'}}}}
        '403': {description: Administrator scope required, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    post:
      tags: [Webhooks]
      summary: Create a webhook endpoint
      operationId: postWebhook
      description: Creates an HTTPS endpoint. The signing secret is returned once and stored encrypted by Smartbis.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WebhookCreateRequest'}
      responses:
        '201': {description: Webhook created, content: {application/json: {schema: {$ref: '#/components/schemas/WebhookCreateResponse'}}}}
        '422': {description: Invalid URL or event, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /webhooks/deliveries:
    get:
      tags: [Webhooks]
      summary: List webhook delivery attempts
      operationId: getWebhookDeliveries
      security: [{bearerAuth: []}]
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: per_page, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        '200': {description: Delivery audit returned, content: {application/json: {schema: {$ref: '#/components/schemas/WebhookDeliveryListResponse'}}}}
  /webhooks/{webhook_id}:
    patch:
      tags: [Webhooks]
      summary: Update, deactivate, or rotate a webhook endpoint
      operationId: patchWebhook
      security: [{bearerAuth: []}]
      parameters:
        - {name: webhook_id, in: path, required: true, schema: {type: integer, minimum: 1}}
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url: {type: string, format: uri, pattern: '^https://'}
                events: {type: array, minItems: 1, uniqueItems: true, items: {type: string, enum: [subscription.activated, subscription.past_due, subscription.expired, subscription.cancelled]}}
                active: {type: boolean}
                rotate_secret: {type: boolean}
      responses:
        '200': {description: Webhook updated; signing_secret is returned only when rotated, content: {application/json: {schema: {$ref: '#/components/schemas/WebhookCreateResponse'}}}}
        '404': {description: Webhook not found, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /eligibility/history:
    get:
      tags: [Eligibility]
      summary: List eligibility change history
      operationId: getEligibilityHistory
      security: [{bearerAuth: []}]
      parameters:
        - {name: beneficiary_type, in: query, schema: {type: string, enum: [holder, dependent]}}
        - {name: beneficiary_id, in: query, schema: {type: integer, minimum: 1}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: per_page, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        '200': {description: Eligibility history returned, content: {application/json: {schema: {$ref: '#/components/schemas/EligibilityHistoryListResponse'}}}}
  /beneficiaries/{beneficiary_type}/{beneficiary_id}/providers/{provider_key}:
    parameters:
      - {name: beneficiary_type, in: path, required: true, schema: {type: string, enum: [holder, dependent]}}
      - {name: beneficiary_id, in: path, required: true, schema: {type: integer, minimum: 1}}
      - {name: provider_key, in: path, required: true, schema: {type: string, pattern: '^[A-Za-z0-9._-]{2,100}$'}}
    get:
      tags: [Providers]
      summary: Get an external beneficiary identifier
      operationId: getBeneficiaryProvider
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Provider link returned, content: {application/json: {schema: {$ref: '#/components/schemas/ProviderLinkResponse'}}}}
        '404': {description: Beneficiary or provider link not found, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    put:
      tags: [Providers]
      summary: Create or update an external beneficiary identifier
      operationId: putBeneficiaryProvider
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                external_beneficiary_id: {type: string, maxLength: 255}
              required: [external_beneficiary_id]
      responses:
        '200': {description: Provider link saved, content: {application/json: {schema: {$ref: '#/components/schemas/ProviderLinkResponse'}}}}
        '409': {description: External identifier conflict, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /access-links:
    post:
      tags: [Access Links]
      summary: Issue a short-lived, single-use access token
      operationId: postAccessLink
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AccessLinkRequest'}
      responses:
        '201': {description: Access token issued, content: {application/json: {schema: {$ref: '#/components/schemas/AccessLinkResponse'}}}}
        '409': {description: Provider link must be configured first, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /access-links/consume:
    post:
      tags: [Access Links]
      summary: Consume a single-use access token
      operationId: postConsumeAccessLink
      description: Public exchange endpoint authenticated by the signed, expiring, single-use token itself.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                access_token: {type: string}
              required: [access_token]
      responses:
        '200': {description: Access token consumed, content: {application/json: {schema: {$ref: '#/components/schemas/AccessLinkConsumeResponse'}}}}
        '401': {description: Invalid or expired signature, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '409': {description: Token already used or expired, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique key for this logical write (8 to 128 letters, digits, dot, underscore, colon, or hyphen).
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]+$'
  schemas:
    Error:
      type: object
      properties:
        code:
          type: integer
          example: 403
        status:
          type: string
          example: error
        data:
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              items: {}
        message:
          type: string
          example: Forbidden
        request_id:
          type: string
          example: 879c2e5f32fe9a8bdd07845a
        error:
          type: object
          properties:
            type: {type: string, example: forbidden}
            message: {type: string, example: Forbidden}
      required:
        - code
        - status
        - data
        - message
    Partner:
      type: object
      properties:
        partner_id: {type: integer, example: 42}
        name: {type: string, example: Downtown Store}
        description: {type: string}
        segment_id: {type: integer, nullable: true, example: 7}
        segment_name: {type: string, nullable: true, example: Restaurants}
        phone: {type: string, example: '+551130000000'}
        whatsapp: {type: string, example: '+5511999999999'}
        email: {type: string, format: email, example: store@example.com}
        map_enabled: {type: integer, enum: [0, 1], example: 1}
        map_embed_url: {type: string, format: uri, nullable: true}
        website_enabled: {type: integer, enum: [0, 1], example: 1}
        website: {type: string, nullable: true, example: example.com}
        uses_administrator_conversion: {type: integer, enum: [0, 1], example: 1}
        conversion:
          type: number
          format: float
          nullable: true
          description: Stored local conversion factor; null when administrator conversion is inherited. Cashback percentages are normalized, so 5% is returned as 0.05.
          example: 0.05
        active: {type: integer, enum: [0, 1], example: 1}
        status_changed_at: {type: string, nullable: true, example: '2026-10-01 14:30:00'}
        created_at: {type: string, example: '2026-01-10 09:00:00'}
      required: [partner_id, name, description, map_enabled, website_enabled, uses_administrator_conversion, active, created_at]
    CreatePartnerRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 25
          description: Letters, numbers, spaces, and ampersands only.
          example: Downtown Store
        description: {type: string, example: Main downtown service location.}
        segment_id: {type: integer, minimum: 1, example: 7}
        phone: {type: string, minLength: 1, maxLength: 300, example: '+551130000000'}
        whatsapp: {type: string, minLength: 1, maxLength: 20, example: '+5511999999999'}
        email: {type: string, format: email, maxLength: 200, example: store@example.com}
        map_enabled: {type: boolean, default: false}
        map_embed_url:
          type: string
          format: uri
          description: Google Maps embed URL beginning with `https://www.google.com/maps/embed?`.
        website_enabled: {type: boolean, default: false}
        website: {type: string, maxLength: 200, example: 'https://store.example.com'}
        uses_administrator_conversion:
          type: boolean
          default: true
          description: When true, the partner dynamically inherits the administrator location's conversion.
        conversion:
          type: number
          format: float
          exclusiveMinimum: true
          minimum: 0
          description: Required only for a custom conversion. In cashback programs this is a percentage.
      required: [name, segment_id, phone, whatsapp]
    UpdatePartnerRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 25
          description: Letters, numbers, spaces, and ampersands only.
        description: {type: string}
        segment_id: {type: integer, minimum: 1}
        phone: {type: string, minLength: 1, maxLength: 300}
        whatsapp: {type: string, minLength: 1, maxLength: 20}
        email: {type: string, format: email, maxLength: 200}
        map_enabled: {type: boolean}
        map_embed_url:
          type: string
          format: uri
          description: Google Maps embed URL beginning with `https://www.google.com/maps/embed?`.
        website_enabled: {type: boolean}
        website: {type: string, maxLength: 200}
        uses_administrator_conversion:
          type: boolean
          description: When true, the partner dynamically inherits the administrator location's conversion.
        conversion:
          type: number
          format: float
          exclusiveMinimum: true
          minimum: 0
          description: Custom conversion value. In cashback programs this is a percentage.
        active:
          type: boolean
          description: Activates or deactivates the partner. Deactivation removes the partner's operator links.
    PartnerResponse:
      type: object
      properties:
        code: {type: integer, example: 200}
        status: {type: string, example: success}
        data:
          type: object
          properties:
            partner: {$ref: '#/components/schemas/Partner'}
          required: [partner]
        request_id: {type: string}
      required: [code, status, data, request_id]
    PartnerListResponse:
      type: object
      properties:
        code: {type: integer, example: 200}
        status: {type: string, example: success}
        data:
          type: object
          properties:
            total: {type: integer, example: 2}
            page: {type: integer, example: 1}
            per_page: {type: integer, example: 50}
            total_pages: {type: integer, example: 1}
            items:
              type: array
              items: {$ref: '#/components/schemas/Partner'}
          required: [total, page, per_page, total_pages, items]
        request_id: {type: string}
      required: [code, status, data, request_id]
    DependentEligibility:
      type: object
      properties:
        status: {type: string, enum: [active, past_due, expired, cancelled, none]}
        inherited_from_holder: {type: boolean, example: true}
        holder_customer_id: {type: integer}
        status_changed_at: {type: string, nullable: true}
      required: [status, inherited_from_holder, holder_customer_id]
    Dependent:
      type: object
      properties:
        dependent_id: {type: integer}
        holder_customer_id: {type: integer}
        name: {type: string}
        document: {type: string}
        phone: {type: string}
        birth_date: {type: string, format: date, nullable: true}
        identity_document: {type: string}
        country: {type: string}
        eligibility: {$ref: '#/components/schemas/DependentEligibility'}
      required: [dependent_id, holder_customer_id, name, document, eligibility]
    DependentWrite:
      type: object
      properties:
        name: {type: string}
        document: {type: string}
        phone: {type: string}
        birth_date: {type: string, format: date}
        identity_document: {type: string}
        country: {type: string}
      required: [name, document]
    DependentUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 3}
        phone:
          type: string
          description: Send an empty string to clear the optional phone.
        birth_date:
          type: string
          description: Valid YYYY-MM-DD date, or an empty string to clear it.
        identity_document: {type: string}
        country:
          type: string
          minLength: 2
          maxLength: 2
          description: ISO 3166-1 alpha-2 country code.
    DependentResponse:
      type: object
      properties:
        code: {type: integer}
        status: {type: string}
        request_id: {type: string}
        data:
          type: object
          properties:
            dependent: {$ref: '#/components/schemas/Dependent'}
      required: [code, status, data]
    ActiveLife:
      type: object
      properties:
        beneficiary_type: {type: string, enum: [holder, dependent]}
        beneficiary_id: {type: integer}
        holder_customer_id: {type: integer}
        name: {type: string}
        document: {type: string}
        plan_id: {type: integer}
        status: {type: string, enum: [active]}
        status_changed_at: {type: string, nullable: true}
      required: [beneficiary_type, beneficiary_id, holder_customer_id, name, plan_id, status]
    ReconciliationResponse:
      type: object
      properties:
        code: {type: integer, example: 200}
        status: {type: string, example: success}
        request_id: {type: string}
        data:
          type: object
          properties:
            total: {type: integer}
            page: {type: integer}
            per_page: {type: integer}
            total_pages: {type: integer}
            items: {type: array, items: {$ref: '#/components/schemas/ActiveLife'}}
      required: [code, status, data]
    WebhookEndpoint:
      type: object
      properties:
        webhook_id: {type: integer}
        url: {type: string, format: uri}
        events: {type: array, items: {type: string, enum: [subscription.activated, subscription.past_due, subscription.expired, subscription.cancelled]}}
        active: {type: boolean}
        created_at: {type: string}
        updated_at: {type: string}
      required: [webhook_id, url, events, active]
    WebhookCreateRequest:
      type: object
      properties:
        url: {type: string, format: uri, pattern: '^https://'}
        events: {type: array, minItems: 1, uniqueItems: true, items: {type: string, enum: [subscription.activated, subscription.past_due, subscription.expired, subscription.cancelled]}}
      required: [url, events]
    WebhookCreateResponse:
      type: object
      properties:
        code: {type: integer, example: 201}
        status: {type: string, example: success}
        data:
          allOf:
            - $ref: '#/components/schemas/WebhookEndpoint'
            - type: object
              properties:
                signing_secret: {type: string, description: Returned only once.}
      required: [code, status, data]
    WebhookListResponse:
      type: object
      properties:
        code: {type: integer}
        status: {type: string}
        data:
          type: object
          properties:
            total: {type: integer}
            items: {type: array, items: {$ref: '#/components/schemas/WebhookEndpoint'}}
      required: [code, status, data]
    WebhookDelivery:
      type: object
      properties:
        delivery_id: {type: integer}
        webhook_id: {type: integer}
        event_id: {type: string, format: uuid}
        event_type: {type: string}
        attempt_count: {type: integer}
        next_attempt_at: {type: string, nullable: true}
        delivered_at: {type: string, nullable: true}
        last_http_status: {type: integer, nullable: true}
        last_error: {type: string, nullable: true}
        created_at: {type: string}
    WebhookDeliveryListResponse:
      type: object
      properties:
        code: {type: integer}
        status: {type: string}
        data:
          type: object
          properties:
            total: {type: integer}
            page: {type: integer}
