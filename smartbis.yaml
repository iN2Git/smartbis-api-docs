    post:
      tags:
        - Coupons
      summary: Create Coupon or Reward
      operationId: postCoupon
      description: |
        Creates and immediately publishes a coupon or reward using the same business fields as the Smartbis panel.
        The target `store_id` is required and must identify an active, non-marketplace store in the authenticated
        company. Category and geographic coordinates are inherited from that store. The operation respects the
        store's active coupon limit.

        When `automatic_calculation` is false, `redemption_points` is required and is stored as the final amount
        deducted on redemption. When it is true, Smartbis calculates the amount from `estimated_value`,
        `benefit_percentage`, and the effective conversion configured for the store. Images are managed in the panel
        and are not accepted by this JSON endpoint. Administrator access is required.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCouponRequest'
            examples:
              manualPoints:
                summary: Publish a reward with a manually defined redemption cost
                value:
                  store_id: 10
                  description: Free Product
                  details: Redeem this reward at the selected store.
                  type: 3
                  estimated_value: 50
                  benefit_percentage: 100
                  redemption_points: 500
                  automatic_calculation: false
                  stock: 100
                  limit: 1
                  validity_days: 30
              automaticPoints:
                summary: Let Smartbis calculate the redemption cost
                value:
                  store_id: 10
                  description: 10 Percent Off
                  type: 2
                  estimated_value: 100
                  benefit_percentage: 10
                  automatic_calculation: true
                  stock: 50
                  limit: 1
                  validity_days: 15
              customRedirect:
                summary: Publish a reward that redirects to an external HTTPS destination
                value:
                  store_id: 10
                  description: Online Discount
                  type: 2
                  estimated_value: 20
                  benefit_percentage: 10
                  redemption_points: 200
                  automatic_calculation: false
                  stock: 100
                  limit: 1
                  validity_days: 30
                  custom_redirect_enabled: true
                  custom_redirect_url: https://shop.example.com/redeem
                  custom_code: SAVE10
      responses:
        '201':
          description: Coupon created and published successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCouponResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Administrator access is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Store not found in the authenticated company.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Store coupon limit reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Invalid field, value, calculation mode, redirect configuration, or idempotency key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Coupon could not be created safely.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /coupons/{coupon_id}:
    patch:
      tags:
        - Coupons
      summary: Update Coupon or Reward
      operationId: patchCoupon
      description: |
        Partially updates an existing coupon or reward. Send `active: true` to activate it or `active: false` to
        deactivate it. Reactivation respects the active coupon limit configured for the original store. The target
        store and inherited category cannot be changed.

        `automatic_calculation` is an update instruction rather than persisted state. Send it as `true` to recalculate
        the redemption cost from the resulting estimated value, benefit percentage, and current effective store
        conversion. Otherwise the existing redemption cost remains unchanged unless `redemption_points` is supplied.
        Do not send both automatic calculation and redemption points. Stock is intentionally excluded; use the
        dedicated stock endpoint. Administrator access is required.
      security:
        - bearerAuth: []
      parameters:
        - name: coupon_id
          in: path
          required: true
          schema: {type: integer, minimum: 1}
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCouponRequest'
            examples:
              content:
                summary: Update reward content and redemption rules
                value:
                  description: Updated Reward
                  details: Updated redemption instructions.
                  estimated_value: 75
                  benefit_percentage: 100
                  redemption_points: 750
                  limit: 2
                  validity_days: 45
              recalculate:
                summary: Recalculate the redemption cost using the store conversion
                value:
                  estimated_value: 100
                  benefit_percentage: 20
                  automatic_calculation: true
              deactivate:
                value:
                  active: false
              activate:
                value:
                  active: true
      responses:
        '200':
          description: Coupon updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCouponResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Administrator access is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Coupon not found in the authenticated company.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Coupon store inactive, concurrent state change, or active coupon limit reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Invalid or unsupported field, value, calculation mode, redirect configuration, or idempotency key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Coupon could not be updated safely.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

