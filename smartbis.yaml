            page:
              type: integer
              example: 1
            per_page:
              type: integer
              example: 50
            total_pages:
              type: integer
              example: 1
            wallet_balance:
              type: number
              format: float
              description: Current balance calculated from the authenticated company's customer ledger.
              example: 125.5
            balance_mode:
              type: string
              enum: [global, partner]
              description: Indicates whether the company uses one global wallet or balances separated by partner.
              example: partner
            partner_balances:
              type: array
              description: Partner balance composition in partner mode. Empty in global mode.
              items:
                $ref: '#/components/schemas/PartnerBalance'
            items:
              type: array
              items:
                $ref: '#/components/schemas/Transaction'
          required:
            - total
            - page
            - per_page
            - total_pages
            - wallet_balance
            - balance_mode
            - partner_balances
            - items
      required:
        - code
        - status
        - data
    PartnerBalance:
      type: object
      properties:
        partner_id:
          type: integer
          minimum: 0
          description: Smartbis location identifier. Zero may represent a legacy administrator movement without a location ID.
          example: 10
        partner_name:
          type: string
          example: Downtown Store
        balance:
          type: number
          format: float
          example: 75.5
      required: [partner_id, partner_name, balance]
    RefundTransactionRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 100
          description: Reason for refunding the transaction.
          example: Customer requested sale cancellation
      required:
        - reason
    RefundTransactionResponse:
      type: object
      properties:
        code:
          type: integer
          example: 200
        status:
          type: string
          example: success
        data:
          type: object
          properties:
            transaction_id:
              type: integer
              example: 123456
            customer_id:
              type: integer
              example: 12345
            refunded_amount:
              type: number
              format: float
              example: 10.0
            wallet_balance:
              type: number
              format: float
              example: 90.0
            result:
              type: object
              additionalProperties: true
          required:
            - transaction_id
            - customer_id
            - refunded_amount
            - wallet_balance
        message:
          type: string
          example: Transaction refunded successfully
      required:
        - code
        - status
        - data
