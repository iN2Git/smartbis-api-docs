openapi: 3.0.3
info:
  title: Smartbis API v2
  version: 1.9.0
  description: |
    Smartbis API v2 enables external systems to integrate directly with the Smartbis Loyalty Marketing platform,
    allowing businesses to automate customer engagement, register sales, validate coupons, and interact with the
    loyalty rewards engine in real time.

    The API is designed for secure server-to-server integrations and uses JSON communication with Bearer Token authentication.

    Base URL
    https://api.smartbis.com/v2/

    Authentication

    Step 1 — Generate Access Token  
    POST /auth/token

    Provide your `api_key` and `api_secret` to obtain an `access_token`.

    Operator credentials and permissions

    Each API Key identifies one Smartbis user. The administrator API Key operates in the main operation. For a
    registered store, use the API Key of an operator linked to that store. The operator may authenticate with their
    own Secret Key or with the administrator's Secret Key. Using the
    administrator's Secret Key does not grant administrator privileges: authorization always follows the user in the
    API Key and the same store permissions configured in the Smartbis app.

    • Sales permission: register sales, list related transactions, and refund the operator's own sales
    • Voucher validation permission: list, validate, and perform the existing manual voucher redemption for the linked store
    • Customer registration permission: create and update customers for the linked store
    • Customer visibility: according to the store settings, an operator may see all company customers or only
      customers related to that operator or registered by an authorized store

    Multi-store accounts

    For operators, the API derives the store from their permissions. To process a sale in another store, use
    the API Key of an operator authorized to register sales in that store and generate a separate Bearer token. The
    administrator API Key registers sales in the administrator's main operation; it does not select or distribute sales
    among registered stores. `POST /sales` does not accept `store_id` or another override field/header. If an operator is linked to more than one store for the same operation, the API returns
    `409 Conflict` instead of selecting a store arbitrarily.

    Step 2 — Use Bearer Token

    Include the token in every request header:

    Authorization: Bearer {access_token}

    Request Format

    • All requests must use `application/json`  
    • All responses are returned in JSON  
    • UTF-8 encoding is used throughout the API

    Error handling

    • `400 Bad Request`: malformed JSON or invalid request body
    • `401 Unauthorized`: missing, invalid, or expired credentials
    • `403 Forbidden`: authenticated user without the required permission
    • `404 Not Found`: resource not found within the user's authorized scope
    • `409 Conflict`: conflicting state or ambiguous store configuration
    • `415 Unsupported Media Type`: a request body was not sent as `application/json`
    • `422 Unprocessable Entity`: field or business-rule validation failed
    • `500 Internal Server Error`: the operation could not be completed safely

    Core Features

    • Customer Management  
    • Direct Referral Visibility
    • Sales Registration (loyalty engine trigger)  
    • Customer Transaction History and Refunds
    • Rewards access and inventory management  
    • Categories management  
    • Voucher validation
    • Participant plans and subscription access management
    • Dependents, inherited eligibility, and active-life reconciliation

    Write safety and authorization

    Every write operation requires `Idempotency-Key` (8–128 characters). Reusing the same key with the same request
    returns the stored response; reusing it with another payload returns `409 Conflict`. Token responses expose the
    effective scopes derived from the administrator role or the operator permissions already configured in Smartbis.

    Typical Integration Flow

    1. Generate an access token using the API Key of the administrator or operator who will perform the request
    2. Create or locate a customer  
    3. Register a sale using `sale_amount`  
    4. Smartbis processes loyalty rewards automatically
    5. List the customer's transactions to obtain a `transaction_id` when a refund is needed
    6. Refund the original transaction using its `transaction_id`
servers:
  - url: https://api.smartbis.com/v2
tags:
  - name: Auth
  - name: Customers
  - name: Referrals
  - name: Partners
  - name: Register Sales
  - name: Transactions
  - name: Coupons
  - name: Categories
  - name: Vouchers
  - name: Plans
  - name: Subscriptions
  - name: Dependents
  - name: Eligibility
  - name: Webhooks
  - name: Providers
  - name: Access Links
paths:
  /auth/token:
    post:
      tags:
        - Auth
      summary: Generate Token
      operationId: postGenerateToken
      description: |
        Generates a cryptographically signed, opaque Bearer token used by subsequent requests. The API Key determines the authenticated
        user. An operator may use their own Secret Key or the administrator's Secret Key, but the resulting token
        keeps the identity and permissions of the operator in the API Key.

        An active operator must have at least one API permission in an active store. For multi-store integrations,
        generate and keep a separate token for each operator/store context. Tokens expire after 24 hours.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                api_key:
                  type: string
                  example: '{{api_key}}'
                api_secret:
                  type: string
                  example: '{{api_secret}}'
              required:
                - api_key
                - api_secret
            example:
              api_key: '{{api_key}}'
              api_secret: '{{api_secret}}'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      access_token:
                        type: string
                      token_type:
                        type: string
                        example: Bearer
                      expires_in:
                        type: integer
                        example: 86400
                      scopes:
                        type: array
                        description: Effective authorization scopes derived from the authenticated user's current Smartbis permissions.
                        items: {type: string}
                        example: ['customers:read', 'customers:write']
                    required:
                      - access_token
                      - token_type
                      - expires_in
                      - scopes
                required:
                  - code
                  - status
                  - data
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Token could not be generated safely.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /partners:
    get:
      tags: [Partners]
      summary: List partners
      operationId: getPartners
      description: |
        Lists the authenticated company's own partners. The administrator's master location, marketplace locations,
        and automatically generated integration locations are excluded. Both active and inactive partners are
        returned unless the optional `active` filter is provided. Administrator access is required.
      security: [{bearerAuth: []}]
      parameters:
        - name: page
          in: query
          required: false
          schema: {type: integer, minimum: 1, default: 1}
        - name: per_page
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
        - name: active
          in: query
          required: false
          description: Filters partners by active status. Accepts `true`, `false`, `1`, or `0`.
          schema: {type: boolean}
      responses:
        '200':
          description: Partners returned successfully.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PartnerListResponse'}
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403':
          description: Administrator access is required.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422':
          description: Invalid active filter.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
    post:
      tags: [Partners]
      summary: Create a partner
      operationId: postPartner
      description: |
        Creates and immediately activates an own partner using the same registration rules as the Smartbis panel.
        The selected segment must be active and belong to the authenticated company. Creation respects the company's
        plan: MicroClub does not allow own partners, and MiniClub allows at most five active partners. Free accounts
        retain the existing unrestricted panel behavior.

        By default, the partner inherits the administrator location's conversion. Set
        `uses_administrator_conversion` to `false` and provide `conversion` to configure a local value. For cashback
        programs, `conversion` is the user-facing percentage (for example, `5` means 5% and is stored as `0.05`). For
        point programs, it is the number of points corresponding to one monetary unit. Operator permissions,
        financial limits, integration credentials, and image uploads remain panel-only. Administrator access is required.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreatePartnerRequest'}
            examples:
              inheritedConversion:
                summary: Create a partner using the administrator conversion
                value:
                  name: Downtown Store
                  description: Main downtown service location.
                  segment_id: 7
                  phone: '+551130000000'
                  whatsapp: '+5511999999999'
                  email: store@example.com
                  uses_administrator_conversion: true
              customCashback:
                summary: Create a partner with a custom cashback percentage
                value:
                  name: North Store
                  segment_id: 7
                  phone: '+551130000001'
                  whatsapp: '+5511999999998'
                  uses_administrator_conversion: false
                  conversion: 5
                  website_enabled: true
                  website: https://store.example.com
      responses:
        '201':
          description: Partner created successfully.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PartnerResponse'}
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403':
          description: Administrator access is required or the current plan does not allow own partners.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404':
          description: Active segment not found in the authenticated company.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: Active partner limit reached or company state changed concurrently.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422':
          description: Invalid field, value, conversion configuration, or idempotency key.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500':
          description: Partner could not be created safely.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /partners/{partner_id}:
    parameters:
      - name: partner_id
        in: path
        required: true
        schema: {type: integer, minimum: 1}
    get:
      tags: [Partners]
      summary: Get partner details
      operationId: getPartner
      description: |
        Returns a partner belonging to the authenticated company. Internal integration settings, API credentials,
        operator permissions, financial configuration, and the administrator's master location are never exposed.
        Administrator access is required.
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Partner returned successfully.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PartnerResponse'}
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403':
          description: Administrator access is required.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404':
          description: Partner not found in the authenticated company.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
    patch:
      tags: [Partners]
      summary: Update, activate, or deactivate a partner
      operationId: patchPartner
      description: |
        Partially updates an own partner. Omitted fields remain unchanged. Send `active: true` to activate the partner
        or `active: false` to deactivate it; no separate status endpoint exists. Activation respects the company's
        plan and requires at least one operator already linked to the partner. As in the Smartbis panel, deactivation
        removes all operator links for sales registration, voucher validation, and customer registration. Operators
        must be reassigned in the panel before that partner can subsequently be reactivated.

        Updating the local conversion or changing between local and administrator conversion atomically recalculates
        the redemption points of the partner's value-based coupons using the existing Smartbis calculation. For
        cashback programs, `conversion` is the user-facing percentage. Operator permissions, financial limits,
        integration credentials, and image uploads cannot be changed through this endpoint. Administrator access is required.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdatePartnerRequest'}
            examples:
              profile:
                value:
                  name: Updated Store
                  phone: '+551130000002'
                  email: updated-store@example.com
              customConversion:
                value:
                  uses_administrator_conversion: false
                  conversion: 7.5
              inheritConversion:
                value:
                  uses_administrator_conversion: true
              deactivate:
                value:
                  active: false
              activate:
                value:
                  active: true
      responses:
        '200':
          description: Partner updated successfully.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PartnerResponse'}
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403':
          description: Administrator access is required or the current plan does not allow own partners.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404':
          description: Partner or active segment not found in the authenticated company.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: Activation limit reached, no operator is linked, or the administrator conversion is unavailable.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422':
          description: Invalid field, value, conversion configuration, or idempotency key.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500':
          description: Partner or related coupon points could not be updated safely.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /customers/{customer_id}/dependents:
    parameters:
      - name: customer_id
        in: path
        required: true
        schema: {type: integer}
    get:
      tags: [Dependents]
      summary: List a holder's dependents
      operationId: getCustomerDependents
      description: Returns dependents belonging to the authenticated company. Eligibility is inherited from the holder. Administrator scope is required.
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Dependents returned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: {type: integer, example: 200}
                  status: {type: string, example: success}
                  data:
                    type: object
                    properties:
                      total: {type: integer}
                      items: {type: array, items: {$ref: '#/components/schemas/Dependent'}}
        '403': {description: 'Missing dependents:read scope', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '404': {description: Holder not found, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    post:
      tags: [Dependents]
      summary: Create a dependent
      operationId: postCustomerDependent
      description: Creates a dependent linked to the holder, respecting company isolation and the holder plan limit. Administrator scope is required.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DependentWrite'}
      responses:
        '201': {description: Dependent created, content: {application/json: {schema: {$ref: '#/components/schemas/DependentResponse'}}}}
        '409': {description: Duplicate document or plan limit reached, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '422': {description: Invalid field or idempotency key, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /dependents/{dependent_id}:
    parameters:
      - name: dependent_id
        in: path
        required: true
        schema: {type: integer}
    get:
      tags: [Dependents]
      summary: Get a dependent and individual eligibility
      operationId: getDependent
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Dependent returned, content: {application/json: {schema: {$ref: '#/components/schemas/DependentResponse'}}}}
        '404': {description: Dependent not found in the authenticated company, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    patch:
      tags: [Dependents]
      summary: Update a dependent
      operationId: patchDependent
      description: |
        Partially updates the dependent fields supported by the existing Smartbis data model. Omitted fields remain
        unchanged. Send an empty string to clear the optional phone, birth date, or identity document.

        The holder and public document are immutable through this endpoint. Dependents do not have an independent
        active status; their eligibility is inherited from the holder. This endpoint does not delete dependents.
        Administrator scope is required.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DependentUpdate'}
      responses:
        '200': {description: Dependent updated, content: {application/json: {schema: {$ref: '#/components/schemas/DependentResponse'}}}}
        '404': {description: Dependent not found in the authenticated company, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '422': {description: Invalid field or idempotency key, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /eligibility/reconciliation:
    get:
      tags: [Eligibility]
      summary: Reconcile active lives by plan and period
      operationId: getEligibilityReconciliation
      description: Returns active holders and dependents. Dependents inherit the holder's eligibility. Clinical data is never returned.
      security: [{bearerAuth: []}]
      parameters:
        - {name: plan_id, in: query, required: true, schema: {type: integer, minimum: 1}}
        - {name: from, in: query, required: false, schema: {type: string, format: date}}
        - {name: to, in: query, required: false, schema: {type: string, format: date}}
        - {name: page, in: query, required: false, schema: {type: integer, minimum: 1, default: 1}}
        - {name: per_page, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
      responses:
        '200': {description: Active lives returned, content: {application/json: {schema: {$ref: '#/components/schemas/ReconciliationResponse'}}}}
        '422': {description: Invalid plan or period, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /plans:
    get:
      tags:
        - Plans
      summary: List participant plans
      operationId: getPlans
      description: Lists the participant plans configured by the authenticated company. Administrator access is required.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Plans returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Administrator access is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /plans/{plan_id}:
    get:
      tags:
        - Plans
      summary: Get participant plan
      operationId: getPlan
      security:
        - bearerAuth: []
      parameters:
        - name: plan_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Plan returned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      plan:
                        $ref: '#/components/schemas/Plan'
        '404':
          description: Plan not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /subscriptions:
    get:
      tags:
        - Subscriptions
      summary: List participant subscriptions
      operationId: getSubscriptions
      description: Lists participant plan access records. By default, customers without a subscription history are omitted. Administrator access is required.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, past_due, expired, cancelled, none]
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: Subscriptions returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionListResponse'
        '403':
          description: Administrator access is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /subscriptions/{customer_id}:
    get:
      tags:
        - Subscriptions
      summary: Get a participant subscription
      operationId: getSubscription
      security:
        - bearerAuth: []
      parameters:
        - name: customer_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Subscription returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags:
        - Subscriptions
      summary: Manage participant plan access
      operationId: patchSubscription
      description: |
        Activates, marks past due, cancels, or clears a participant's plan access in Smartbis. This endpoint manages
        entitlement only. It does not create charges, refund payments, or cancel subscriptions in Stripe, Mercado Pago,
        or another payment gateway. Administrator access is required.
      security:
        - bearerAuth: []
      parameters:
        - name: customer_id
          in: path
          required: true
          schema:
            type: integer
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManageSubscriptionRequest'
      responses:
        '200':
          description: Subscription access updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManageSubscriptionResponse'
        '404':
          description: Customer or active plan not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Invalid subscription transition or field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /customers/{customer_id}/transactions:
    get:
      tags:
        - Transactions
      summary: List Customer Transactions
      operationId: getCustomerTransactions
      description: |
        Returns the customer's paginated transaction history. The `transaction_id` field is the unique identifier
        of the transaction and must be used when requesting a refund. Only transactions where `refundable` is `true`
        are eligible for refund. Operators need permission to register sales and receive only transactions registered by their
        own operator identity. Administrators can view the company-wide history.

        `wallet_balance` is calculated from the customer's ledger for the authenticated company instead of using the
        cached customer value. `balance_mode` indicates whether the company uses a global wallet or balances separated
        by partner. In partner mode, administrators receive every partner balance, while operators receive balances
        only for partners where they have sales-registration permission. This endpoint is the canonical statement;
        no separate wallet-statement endpoint exists.
      security:
        - bearerAuth: []
      parameters:
        - name: customer_id
          in: path
          required: true
          description: Smartbis customer identifier.
          schema:
            type: integer
            example: 12345
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
            example: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
            example: 50
      responses:
        '200':
          description: Customer transactions returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The authenticated operator does not have permission to register sales.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /customers/{customer_id}/referrals:
    get:
      tags:
        - Referrals
      summary: List direct customer referrals
      operationId: getCustomerReferrals
      description: |
        Returns only customers directly referred by the selected customer. The endpoint does not expand a
        multilevel referral network and does not create, recalculate, or reverse referral rewards. Both the selected
        customer and returned referrals follow the authenticated user's company and customer-visibility rules.
        `wallet_balance` is calculated from each referred customer's ledger for the authenticated company.

        A direct relationship may come from a valid participant invitation or, when both related company settings are
        enabled, from customer creation by an operator. Relationship assignment is separate from reward issuance.
        Referral rewards remain controlled by the existing participant confirmation process and are recorded as normal
        ledger transactions. Use `GET /customers/{customer_id}/transactions` for the existing statement; no separate
        referral statement or referral-reward reversal endpoint exists.
      security:
        - bearerAuth: []
      parameters:
        - name: customer_id
          in: path
          required: true
          description: Smartbis identifier of the referring customer.
          schema:
            type: integer
            example: 12345
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: Direct referrals returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferralListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The authenticated operator has no operational customer permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Customer not found within the authorized scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /customers:
    get:
      tags:
        - Customers
      summary: List or filter customers
      operationId: getListCustomers
      description: |
        Returns customers with optional pagination, public document, phone, or customer ID filters. The same
        visibility rule is applied to lists and direct filters. Depending on the customer visibility setting of an
        authorized store, the operator may view all company customers. Otherwise, results are limited to customers
        related to that operator or registered by an authorized store. Both active and inactive customers may be
        returned; inspect the `active` field before using a customer in an operational flow.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            example: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            example: 50
        - name: customer_id
          in: query
          required: false
          description: Smartbis internal customer identifier.
          schema:
            type: integer
            example: 12345
        - name: document
          in: query
          required: false
          description: Public document configured for the customer, such as CPF, CNPJ, passport, DNI, RUT, or NIF.
          schema:
            type: string
          examples:
            cpf:
              summary: CPF document
              value: '529.982.247-25'
            cnpj:
              summary: CNPJ document
              value: '11.222.333/0001-81'
            passport:
              summary: Passport document
              value: 'AB123456'
        - name: phone
          in: query
          required: false
          description: Customer phone number. It is normalized using the company's country configuration.
          schema:
            type: string
            example: '5511993999994'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The authenticated user has no operational store permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags:
        - Customers
      summary: Create Customer
      operationId: postCreateCustomer
      description: |
        Creates a customer with optional international address fields. `country` uses the ISO 3166-1 alpha-2 format.
        `city_code` is optional; for Brazilian addresses it represents the IBGE municipality code. Address creation
        does not depend on an external postal-code lookup. The `document` type follows the company's customer
        configuration and may be a CPF, CNPJ, passport, DNI, RUT, NIF, or another configured public document.
        Operators must have permission to register customers; the new customer is linked to that operator's
        authorized store.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Test Customer
                document:
                  type: string
                  description: Public document configured by the company, such as CPF, CNPJ, passport, DNI, RUT, or NIF.
                  example: '529.982.247-25'
                phone:
                  type: string
                  example: '11993999994'
                email:
                  type: string
                  example: customer@example.com
                country:
                  type: string
                  minLength: 2
                  maxLength: 2
                  description: ISO 3166-1 alpha-2 country code.
                  example: BR
                postal_code:
                  type: string
                  example: 88032-005
                state:
                  type: string
                  example: SC
                city:
                  type: string
                  example: Florianopolis
                city_code:
                  type: string
                  description: Optional administrative city code. For Brazil, use the IBGE municipality code.
                  example: '4205407'
                street:
                  type: string
                  example: Rodovia Jose Carlos Daux
                number:
                  type: string
                  example: '4150'
                complement:
                  type: string
                  example: Suite 10
                district:
                  type: string
                  example: Saco Grande
                birth_date:
                  type: string
                  example: '1990-01-20'
                gender:
                  type: string
                  example: M
                password:
                  type: string
                  example: '123456'
              required:
                - name
                - phone
                - password
            examples:
              withCpfDocument:
                summary: Create a customer using a CPF document
                value:
                  name: Test Customer
                  document: '529.982.247-25'
                  phone: '11993999994'
                  email: customer@example.com
                  country: BR
                  password: '123456'
              withCnpjDocument:
                summary: Create a business customer using a CNPJ document
                value:
                  name: Test Coworking Ltda
                  document: '11.222.333/0001-81'
                  phone: '11993999994'
                  email: financeiro@example.com
                  country: BR
                  password: '123456'
              withPassportDocument:
                summary: Create a customer using a passport document
                value:
                  name: International Customer
                  document: 'AB123456'
                  phone: '2025550123'
                  email: international@example.com
                  country: US
                  password: '123456'
      responses:
        '201':
          description: Customer created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCustomerResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The operator does not have permission to create customers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Customer already exists, or the operator is linked to more than one store for customer creation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '500':
          description: Customer could not be created safely.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /customers/{customer_id}:
    patch:
      tags:
        - Customers
      summary: Update Customer
      operationId: patchCustomer
      description: |
        Partially updates an existing customer visible to the authenticated operator. Omitted fields remain unchanged.
        Send `active: true` to activate the customer or `active: false` to deactivate the customer. The authenticated
        operator cannot deactivate their own customer record, and reactivation respects the company's participant limit.

        Passwords, wallet balances, plans, and subscriptions cannot be changed through this endpoint. A public document
        can be added when the existing document is empty, but an existing document cannot be replaced. Use the dedicated
        subscription endpoint for plan access changes.
      security:
        - bearerAuth: []
      parameters:
        - name: customer_id
          in: path
          required: true
          description: Smartbis internal customer identifier.
          schema:
            type: integer
            minimum: 1
            example: 12345
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomerRequest'
            examples:
              profile:
                summary: Update contact and address fields
                value:
                  name: Updated Customer
                  phone: '5511993999994'
                  email: updated@example.com
                  postal_code: 88032-005
                  city: Florianopolis
              deactivate:
                summary: Deactivate a customer
                value:
                  active: false
              activate:
                summary: Activate a customer
                value:
                  active: true
      responses:
        '200':
          description: Customer updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCustomerResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The authenticated operator does not have permission to update customers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Customer not found or not visible to the authenticated operator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The document, phone, or email is already in use.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Invalid field, value, status transition, or participant limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Customer could not be updated safely.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /sales:
    post:
      tags:
        - Register Sales
      summary: Register Sale
      operationId: postRegisterSale
      description: |
        Registers a new sale by `customer_id`, the customer's public `document`, or `phone`. The document type follows the
        company's customer configuration and may be a CPF, CNPJ, passport, DNI, RUT, NIF, or another configured
        public document. `sale_amount` must be greater than zero. To reverse a sale, list the customer's transactions
        and use the refund endpoint with the original `transaction_id`.

        **Authorization and store selection:** an operator's sale is processed by the single active store that grants
        sales permission to the operator in the API Key. For another store, use the API Key of an operator authorized
        there and generate a separate token. The administrator API Key registers a sale in the administrator's main
        operation and does not distribute it among registered stores.
        This endpoint does not accept `store_id` or any
        other request field/header to override the resolved store.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/RegisterSaleByDocument'
                - $ref: '#/components/schemas/RegisterSaleByPhone'
                - $ref: '#/components/schemas/RegisterSaleByCustomerId'
            examples:
              byCpfDocument:
                summary: Register sale using a CPF document
                value:
                  document: '529.982.247-25'
                  sale_amount: 100.0
                  description: Sale registered via API
              byCnpjDocument:
                summary: Register sale using a CNPJ document
                value:
                  document: '11.222.333/0001-81'
                  sale_amount: 100.0
                  description: Sale registered via API
              byPassportDocument:
                summary: Register sale using a passport document
                value:
                  document: 'AB123456'
                  sale_amount: 100.0
                  description: Sale registered via API
              byPhone:
                summary: Register sale using a phone number
                value:
                  phone: '5511993999994'
                  sale_amount: 100.0
                  description: Sale registered via API
              byCustomerId:
                summary: Register sale using a customer ID
                value:
                  customer_id: 12345
                  sale_amount: 100.0
                  description: Sale registered via API
      responses:
        '201':
          description: Sale registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterSaleResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The operator does not have permission to register sales.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The operator is linked to more than one active store for sales, or the administrator's main operation is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Customer not found or inactive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /transactions/{transaction_id}/refund:
    post:
      tags:
        - Transactions
      summary: Refund Transaction
      operationId: postRefundTransaction
      description: |
        Refunds the full value generated by the original transaction. The refund amount cannot be supplied or changed
        by the integration. A transaction can only be refunded once, and only transactions returned with
        `refundable: true` are eligible. Operators need permission to register sales and can refund only transactions originally
        registered by their own operator identity in an authorized store.
      security:
        - bearerAuth: []
      parameters:
        - name: transaction_id
          in: path
          required: true
          description: Transaction identifier returned by the customer transaction history endpoint.
          schema:
            type: integer
            example: 123456
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundTransactionRequest'
            example:
              reason: Customer requested sale cancellation
      responses:
        '200':
          description: Transaction refunded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundTransactionResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The authenticated operator does not have permission to register sales.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Transaction not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Transaction already refunded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Transaction is not refundable or request validation failed
