openapi: 3.0.3
info:
  title: Smartbis API v2
  version: 1.5.0
  description: |
    Smartbis API v2 enables external systems to integrate directly with the Smartbis Loyalty Marketing platform,
    allowing businesses to automate customer engagement, register sales, validate coupons, and interact with the
    loyalty rewards engine in real time.

    The API is designed for secure server-to-server integrations and uses JSON communication with Bearer Token authentication.

    Base URL
    https://api.smartbis.com/v2/

    Authentication

    Step 1 — Generate Access Token  
    POST /auth/token

    Provide your `api_key` and `api_secret` to obtain an `access_token`.

    Operator credentials and permissions

    Each API Key identifies one Smartbis user. The administrator API Key operates in the main operation. For a
    registered store, use the API Key of an operator linked to that store. The operator may authenticate with their
    own Secret Key or with the administrator's Secret Key. Using the
    administrator's Secret Key does not grant administrator privileges: authorization always follows the user in the
    API Key and the same store permissions configured in the Smartbis app.

    • Sales permission: register sales, list related transactions, and refund the operator's own sales
    • Voucher validation permission: list and validate vouchers for the linked store
    • Customer registration permission: create customers for the linked store
    • Customer visibility: according to the store settings, an operator may see all company customers or only
      customers related to that operator or registered by an authorized store

    Multi-store accounts

    For operators, the API derives the store from their permissions. To process a sale in another store, use
    the API Key of an operator authorized to register sales in that store and generate a separate Bearer token. The
    administrator API Key registers sales in the administrator's main operation; it does not select or distribute sales
    among registered stores. `POST /sales` does not accept `store_id` or another override field/header. If an operator is linked to more than one store for the same operation, the API returns
    `409 Conflict` instead of selecting a store arbitrarily.

    Step 2 — Use Bearer Token

    Include the token in every request header:

    Authorization: Bearer {access_token}

    Request Format

    • All requests must use `application/json`  
    • All responses are returned in JSON  
    • UTF-8 encoding is used throughout the API

    Error handling

    • `400 Bad Request`: malformed JSON or invalid request body
    • `401 Unauthorized`: missing, invalid, or expired credentials
    • `403 Forbidden`: authenticated user without the required permission
    • `404 Not Found`: resource not found within the user's authorized scope
    • `409 Conflict`: conflicting state or ambiguous store configuration
    • `415 Unsupported Media Type`: a request body was not sent as `application/json`
    • `422 Unprocessable Entity`: field or business-rule validation failed
    • `500 Internal Server Error`: the operation could not be completed safely

    Core Features

    • Customer Management  
    • Sales Registration (loyalty engine trigger)  
    • Customer Transaction History and Refunds
    • Rewards access and inventory management  
    • Categories management  
    • Voucher validation
    • Participant plans and subscription access management
    • Dependents, inherited eligibility, and active-life reconciliation

    Write safety and authorization

    Every write operation requires `Idempotency-Key` (8–128 characters). Reusing the same key with the same request
    returns the stored response; reusing it with another payload returns `409 Conflict`. Token responses expose the
    effective scopes derived from the administrator role or the operator permissions already configured in Smartbis.

    Typical Integration Flow

    1. Generate an access token using the API Key of the administrator or operator who will perform the request
    2. Create or locate a customer  
    3. Register a sale using `sale_amount`  
    4. Smartbis processes loyalty rewards automatically
    5. List the customer's transactions to obtain a `transaction_id` when a refund is needed
    6. Refund the original transaction using its `transaction_id`
servers:
  - url: https://api.smartbis.com/v2
tags:
  - name: Auth
  - name: Customers
  - name: Register Sales
  - name: Transactions
  - name: Coupons
  - name: Categories
  - name: Vouchers
  - name: Plans
  - name: Subscriptions
  - name: Dependents
  - name: Eligibility
  - name: Webhooks
  - name: Providers
  - name: Access Links
paths:
  /auth/token:
    post:
      tags:
        - Auth
      summary: Generate Token
      operationId: postGenerateToken
      description: |
        Generates a cryptographically signed, opaque Bearer token used by subsequent requests. The API Key determines the authenticated
        user. An operator may use their own Secret Key or the administrator's Secret Key, but the resulting token
        keeps the identity and permissions of the operator in the API Key.

        An active operator must have at least one API permission in an active store. For multi-store integrations,
        generate and keep a separate token for each operator/store context. Tokens expire after 24 hours.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                api_key:
                  type: string
                  example: '{{api_key}}'
                api_secret:
                  type: string
                  example: '{{api_secret}}'
              required:
                - api_key
                - api_secret
            example:
              api_key: '{{api_key}}'
              api_secret: '{{api_secret}}'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      access_token:
                        type: string
                      token_type:
                        type: string
                        example: Bearer
                      expires_in:
                        type: integer
                        example: 86400
                      scopes:
                        type: array
                        description: Effective authorization scopes derived from the authenticated user's current Smartbis permissions.
                        items: {type: string}
                        example: ['customers:read', 'customers:write']
                    required:
                      - access_token
                      - token_type
                      - expires_in
                      - scopes
                required:
                  - code
                  - status
                  - data
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Token could not be generated safely.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /customers/{customer_id}/dependents:
    parameters:
      - name: customer_id
        in: path
        required: true
        schema: {type: integer}
    get:
      tags: [Dependents]
      summary: List a holder's dependents
      operationId: getCustomerDependents
      description: Returns dependents belonging to the authenticated company. Eligibility is inherited from the holder. Administrator scope is required.
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Dependents returned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: {type: integer, example: 200}
                  status: {type: string, example: success}
                  data:
                    type: object
                    properties:
                      total: {type: integer}
                      items: {type: array, items: {$ref: '#/components/schemas/Dependent'}}
        '403': {description: 'Missing dependents:read scope', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '404': {description: Holder not found, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    post:
      tags: [Dependents]
      summary: Create a dependent
      operationId: postCustomerDependent
      description: Creates a dependent linked to the holder, respecting company isolation and the holder plan limit. Administrator scope is required.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DependentWrite'}
      responses:
        '201': {description: Dependent created, content: {application/json: {schema: {$ref: '#/components/schemas/DependentResponse'}}}}
        '409': {description: Duplicate document or plan limit reached, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '422': {description: Invalid field or idempotency key, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /dependents/{dependent_id}:
    parameters:
      - name: dependent_id
        in: path
        required: true
        schema: {type: integer}
    get:
      tags: [Dependents]
      summary: Get a dependent and individual eligibility
      operationId: getDependent
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Dependent returned, content: {application/json: {schema: {$ref: '#/components/schemas/DependentResponse'}}}}
        '404': {description: Dependent not found in the authenticated company, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    patch:
      tags: [Dependents]
      summary: Update a dependent
      operationId: patchDependent
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DependentUpdate'}
      responses:
        '200': {description: Dependent updated, content: {application/json: {schema: {$ref: '#/components/schemas/DependentResponse'}}}}
        '404': {description: Dependent not found in the authenticated company, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '422': {description: Invalid field or idempotency key, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /eligibility/reconciliation:
    get:
      tags: [Eligibility]
      summary: Reconcile active lives by plan and period
      operationId: getEligibilityReconciliation
      description: Returns active holders and dependents. Dependents inherit the holder's eligibility. Clinical data is never returned.
      security: [{bearerAuth: []}]
      parameters:
        - {name: plan_id, in: query, required: true, schema: {type: integer, minimum: 1}}
        - {name: from, in: query, required: false, schema: {type: string, format: date}}
        - {name: to, in: query, required: false, schema: {type: string, format: date}}
        - {name: page, in: query, required: false, schema: {type: integer, minimum: 1, default: 1}}
        - {name: per_page, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
      responses:
        '200': {description: Active lives returned, content: {application/json: {schema: {$ref: '#/components/schemas/ReconciliationResponse'}}}}
        '422': {description: Invalid plan or period, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /plans:
    get:
      tags:
        - Plans
      summary: List participant plans
      operationId: getPlans
      description: Lists the participant plans configured by the authenticated company. Administrator access is required.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Plans returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Administrator access is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /plans/{plan_id}:
    get:
      tags:
        - Plans
      summary: Get participant plan
      operationId: getPlan
      security:
        - bearerAuth: []
      parameters:
        - name: plan_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Plan returned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      plan:
                        $ref: '#/components/schemas/Plan'
        '404':
          description: Plan not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /subscriptions:
    get:
      tags:
        - Subscriptions
      summary: List participant subscriptions
      operationId: getSubscriptions
      description: Lists participant plan access records. By default, customers without a subscription history are omitted. Administrator access is required.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, past_due, expired, cancelled, none]
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: Subscriptions returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionListResponse'
        '403':
          description: Administrator access is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /subscriptions/{customer_id}:
    get:
      tags:
        - Subscriptions
      summary: Get a participant subscription
      operationId: getSubscription
      security:
        - bearerAuth: []
      parameters:
        - name: customer_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Subscription returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags:
        - Subscriptions
      summary: Manage participant plan access
      operationId: patchSubscription
      description: |
        Activates, marks past due, cancels, or clears a participant's plan access in Smartbis. This endpoint manages
        entitlement only. It does not create charges, refund payments, or cancel subscriptions in Stripe, Mercado Pago,
        or another payment gateway. Administrator access is required.
      security:
        - bearerAuth: []
      parameters:
        - name: customer_id
          in: path
          required: true
          schema:
            type: integer
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManageSubscriptionRequest'
      responses:
        '200':
          description: Subscription access updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManageSubscriptionResponse'
        '404':
          description: Customer or active plan not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Invalid subscription transition or field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /customers/{customer_id}/transactions:
    get:
      tags:
        - Transactions
      summary: List Customer Transactions
      operationId: getCustomerTransactions
      description: |
        Returns the customer's paginated transaction history. The `transaction_id` field is the unique identifier
        of the transaction and must be used when requesting a refund. Only transactions where `refundable` is `true`
        are eligible for refund. Operators need permission to register sales and receive only transactions registered by their
        own operator identity. Administrators can view the company-wide history.
      security:
        - bearerAuth: []
      parameters:
        - name: customer_id
          in: path
          required: true
          description: Smartbis customer identifier.
          schema:
            type: integer
            example: 12345
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
            example: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
            example: 50
      responses:
        '200':
          description: Customer transactions returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The authenticated operator does not have permission to register sales.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /customers:
    get:
      tags:
        - Customers
      summary: List or filter customers
      operationId: getListCustomers
      description: |
        Returns customers with optional pagination, public document, phone, or customer ID filters. The same
        visibility rule is applied to lists and direct filters. Depending on the customer visibility setting of an
        authorized store, the operator may view all company customers. Otherwise, results are limited to customers
        related to that operator or registered by an authorized store. Both active and inactive customers may be
        returned; inspect the `active` field before using a customer in an operational flow.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            example: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            example: 50
        - name: customer_id
          in: query
          required: false
          description: Smartbis internal customer identifier.
          schema:
            type: integer
            example: 12345
        - name: document
          in: query
          required: false
          description: Public document configured for the customer, such as CPF, CNPJ, passport, DNI, RUT, or NIF.
          schema:
            type: string
          examples:
            cpf:
              summary: CPF document
              value: '529.982.247-25'
            cnpj:
              summary: CNPJ document
              value: '11.222.333/0001-81'
            passport:
              summary: Passport document
              value: 'AB123456'
        - name: phone
          in: query
          required: false
          description: Customer phone number. It is normalized using the company's country configuration.
          schema:
            type: string
            example: '5511993999994'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The authenticated user has no operational store permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags:
        - Customers
      summary: Create Customer
      operationId: postCreateCustomer
      description: |
        Creates a customer with optional international address fields. `country` uses the ISO 3166-1 alpha-2 format.
        `city_code` is optional; for Brazilian addresses it represents the IBGE municipality code. Address creation
        does not depend on an external postal-code lookup. The `document` type follows the company's customer
        configuration and may be a CPF, CNPJ, passport, DNI, RUT, NIF, or another configured public document.
        Operators must have permission to register customers; the new customer is linked to that operator's
        authorized store.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Test Customer
                document:
                  type: string
                  description: Public document configured by the company, such as CPF, CNPJ, passport, DNI, RUT, or NIF.
                  example: '529.982.247-25'
                phone:
                  type: string
                  example: '11993999994'
                email:
                  type: string
                  example: customer@example.com
                country:
                  type: string
                  minLength: 2
                  maxLength: 2
                  description: ISO 3166-1 alpha-2 country code.
                  example: BR
                postal_code:
                  type: string
                  example: 88032-005
                state:
                  type: string
                  example: SC
                city:
                  type: string
                  example: Florianopolis
                city_code:
                  type: string
                  description: Optional administrative city code. For Brazil, use the IBGE municipality code.
                  example: '4205407'
                street:
                  type: string
                  example: Rodovia Jose Carlos Daux
                number:
                  type: string
                  example: '4150'
                complement:
                  type: string
                  example: Suite 10
                district:
                  type: string
                  example: Saco Grande
                birth_date:
                  type: string
                  example: '1990-01-20'
                gender:
                  type: string
                  example: M
                password:
                  type: string
                  example: '123456'
              required:
                - name
                - phone
                - password
            examples:
              withCpfDocument:
                summary: Create a customer using a CPF document
                value:
                  name: Test Customer
                  document: '529.982.247-25'
                  phone: '11993999994'
                  email: customer@example.com
                  country: BR
                  password: '123456'
              withCnpjDocument:
                summary: Create a business customer using a CNPJ document
                value:
                  name: Test Coworking Ltda
                  document: '11.222.333/0001-81'
                  phone: '11993999994'
                  email: financeiro@example.com
                  country: BR
                  password: '123456'
              withPassportDocument:
                summary: Create a customer using a passport document
                value:
                  name: International Customer
                  document: 'AB123456'
                  phone: '2025550123'
                  email: international@example.com
                  country: US
                  password: '123456'
      responses:
        '201':
          description: Customer created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCustomerResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The operator does not have permission to create customers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Customer already exists, or the operator is linked to more than one store for customer creation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '500':
          description: Customer could not be created safely.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /sales:
    post:
      tags:
        - Register Sales
      summary: Register Sale
      operationId: postRegisterSale
      description: |
        Registers a new sale by `customer_id`, the customer's public `document`, or `phone`. The document type follows the
        company's customer configuration and may be a CPF, CNPJ, passport, DNI, RUT, NIF, or another configured
        public document. `sale_amount` must be greater than zero. To reverse a sale, list the customer's transactions
        and use the refund endpoint with the original `transaction_id`.

        **Authorization and store selection:** an operator's sale is processed by the single active store that grants
        sales permission to the operator in the API Key. For another store, use the API Key of an operator authorized
        there and generate a separate token. The administrator API Key registers a sale in the administrator's main
        operation and does not distribute it among registered stores.
        This endpoint does not accept `store_id` or any
        other request field/header to override the resolved store.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/RegisterSaleByDocument'
                - $ref: '#/components/schemas/RegisterSaleByPhone'
                - $ref: '#/components/schemas/RegisterSaleByCustomerId'
            examples:
              byCpfDocument:
                summary: Register sale using a CPF document
                value:
                  document: '529.982.247-25'
                  sale_amount: 100.0
                  description: Sale registered via API
              byCnpjDocument:
                summary: Register sale using a CNPJ document
                value:
                  document: '11.222.333/0001-81'
                  sale_amount: 100.0
                  description: Sale registered via API
              byPassportDocument:
                summary: Register sale using a passport document
                value:
                  document: 'AB123456'
                  sale_amount: 100.0
                  description: Sale registered via API
              byPhone:
                summary: Register sale using a phone number
                value:
                  phone: '5511993999994'
                  sale_amount: 100.0
                  description: Sale registered via API
              byCustomerId:
                summary: Register sale using a customer ID
                value:
                  customer_id: 12345
                  sale_amount: 100.0
                  description: Sale registered via API
      responses:
        '201':
          description: Sale registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterSaleResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The operator does not have permission to register sales.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The operator is linked to more than one active store for sales, or the administrator's main operation is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Customer not found or inactive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /transactions/{transaction_id}/refund:
    post:
      tags:
        - Transactions
      summary: Refund Transaction
      operationId: postRefundTransaction
      description: |
        Refunds the full value generated by the original transaction. The refund amount cannot be supplied or changed
        by the integration. A transaction can only be refunded once, and only transactions returned with
        `refundable: true` are eligible. Operators need permission to register sales and can refund only transactions originally
        registered by their own operator identity in an authorized store.
      security:
        - bearerAuth: []
      parameters:
        - name: transaction_id
          in: path
          required: true
          description: Transaction identifier returned by the customer transaction history endpoint.
          schema:
            type: integer
            example: 123456
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundTransactionRequest'
            example:
              reason: Customer requested sale cancellation
      responses:
        '200':
          description: Transaction refunded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundTransactionResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The authenticated operator does not have permission to register sales.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Transaction not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Transaction already refunded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Transaction is not refundable or request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /coupons:
    get:
      tags:
        - Coupons
      summary: List Coupons
      operationId: getListCoupons
      description: |
        Lists active rewards from stores where the operator has permission to register sales or validate vouchers.
        Administrators can list rewards across the company.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The operator has neither sales nor voucher permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /coupons/{coupon_id}/stock:
    patch:
      tags:
        - Coupons
      summary: Update Reward Stock
      operationId: patchUpdateRewardStock
      description: Administrator-only operation.
      security:
        - bearerAuth: []
      parameters:
        - name: coupon_id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                stock:
                  type: integer
                  minimum: 0
                  example: 80
              required:
                - stock
            example:
              stock: 80
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Administrator access is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Reward not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '500':
          description: Reward stock could not be updated safely.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags:
        - Coupons
      summary: Replace Reward Stock
      operationId: putUpdateRewardStock
      description: Administrator-only operation. This method has the same behavior as PATCH for the `stock` field.
      security:
        - bearerAuth: []
      parameters:
        - name: coupon_id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                stock:
                  type: integer
                  minimum: 0
                  example: 80
              required:
                - stock
            example:
              stock: 80
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Administrator access is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Reward not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '500':
          description: Reward stock could not be updated safely.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /categories:
    get:
      tags:
        - Categories
      summary: List Categories
      operationId: getListCategories
      description: Requires permission to register sales, permission to validate vouchers, or administrator access.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The operator has neither sales nor voucher permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags:
        - Categories
      summary: Create Category
      operationId: postCreateCategory
      description: Administrator-only operation.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                  example: Food & Beverage
              required:
                - description
            example:
              description: Food & Beverage
      responses:
        '201':
          description: Category created successfully
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Administrator access is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '500':
          description: Category could not be created safely.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /vouchers:
    get:
      tags:
        - Vouchers
      summary: List Vouchers
      operationId: getListVouchers
      description: |
        Requires permission to validate vouchers. Operators receive only vouchers issued by stores where they have that
        permission. Administrators can list vouchers across the company.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            example: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            example: 50
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The operator does not have permission to validate vouchers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /vouchers/{voucher_code}/validate:
    post:
      tags:
        - Vouchers
      summary: Validate Voucher
      operationId: postValidateVoucher
      description: |
        Requires voucher validation permission for the store that issued the voucher. An operator cannot validate their own
        non-cashback voucher. Reward vouchers and cashback vouchers are supported, subject to their expiration and
        the store's configured redemption limits. A voucher can be validated only once.
      security:
        - bearerAuth: []
      parameters:
        - name: voucher_code
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Missing store permission, or the operator attempted to validate their own voucher.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Voucher not found in an authorized store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Voucher already validated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Voucher validation could not be committed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /webhooks:
    get:
      tags: [Webhooks]
      summary: List webhook endpoints
      operationId: getWebhooks
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Webhook endpoints returned, content: {application/json: {schema: {$ref: '#/components/schemas/WebhookListResponse'}}}}
        '403': {description: Administrator scope required, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    post:
      tags: [Webhooks]
      summary: Create a webhook endpoint
      operationId: postWebhook
      description: Creates an HTTPS endpoint. The signing secret is returned once and stored encrypted by Smartbis.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WebhookCreateRequest'}
      responses:
        '201': {description: Webhook created, content: {application/json: {schema: {$ref: '#/components/schemas/WebhookCreateResponse'}}}}
        '422': {description: Invalid URL or event, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /webhooks/deliveries:
    get:
      tags: [Webhooks]
      summary: List webhook delivery attempts
      operationId: getWebhookDeliveries
      security: [{bearerAuth: []}]
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: per_page, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        '200': {description: Delivery audit returned, content: {application/json: {schema: {$ref: '#/components/schemas/WebhookDeliveryListResponse'}}}}
  /webhooks/{webhook_id}:
    patch:
      tags: [Webhooks]
      summary: Update, deactivate, or rotate a webhook endpoint
      operationId: patchWebhook
      security: [{bearerAuth: []}]
      parameters:
        - {name: webhook_id, in: path, required: true, schema: {type: integer, minimum: 1}}
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url: {type: string, format: uri, pattern: '^https://'}
                events: {type: array, minItems: 1, uniqueItems: true, items: {type: string, enum: [subscription.activated, subscription.past_due, subscription.expired, subscription.cancelled]}}
                active: {type: boolean}
                rotate_secret: {type: boolean}
      responses:
        '200': {description: Webhook updated; signing_secret is returned only when rotated, content: {application/json: {schema: {$ref: '#/components/schemas/WebhookCreateResponse'}}}}
        '404': {description: Webhook not found, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /eligibility/history:
    get:
      tags: [Eligibility]
      summary: List eligibility change history
      operationId: getEligibilityHistory
      security: [{bearerAuth: []}]
      parameters:
        - {name: beneficiary_type, in: query, schema: {type: string, enum: [holder, dependent]}}
        - {name: beneficiary_id, in: query, schema: {type: integer, minimum: 1}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: per_page, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        '200': {description: Eligibility history returned, content: {application/json: {schema: {$ref: '#/components/schemas/EligibilityHistoryListResponse'}}}}
  /beneficiaries/{beneficiary_type}/{beneficiary_id}/providers/{provider_key}:
    parameters:
      - {name: beneficiary_type, in: path, required: true, schema: {type: string, enum: [holder, dependent]}}
      - {name: beneficiary_id, in: path, required: true, schema: {type: integer, minimum: 1}}
      - {name: provider_key, in: path, required: true, schema: {type: string, pattern: '^[A-Za-z0-9._-]{2,100}$'}}
    get:
      tags: [Providers]
      summary: Get an external beneficiary identifier
      operationId: getBeneficiaryProvider
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Provider link returned, content: {application/json: {schema: {$ref: '#/components/schemas/ProviderLinkResponse'}}}}
        '404': {description: Beneficiary or provider link not found, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    put:
      tags: [Providers]
      summary: Create or update an external beneficiary identifier
      operationId: putBeneficiaryProvider
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                external_beneficiary_id: {type: string, maxLength: 255}
              required: [external_beneficiary_id]
      responses:
        '200': {description: Provider link saved, content: {application/json: {schema: {$ref: '#/components/schemas/ProviderLinkResponse'}}}}
        '409': {description: External identifier conflict, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /access-links:
    post:
      tags: [Access Links]
      summary: Issue a short-lived, single-use access token
      operationId: postAccessLink
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AccessLinkRequest'}
      responses:
        '201': {description: Access token issued, content: {application/json: {schema: {$ref: '#/components/schemas/AccessLinkResponse'}}}}
        '409': {description: Provider link must be configured first, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /access-links/consume:
    post:
      tags: [Access Links]
      summary: Consume a single-use access token
      operationId: postConsumeAccessLink
      description: Public exchange endpoint authenticated by the signed, expiring, single-use token itself.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                access_token: {type: string}
              required: [access_token]
      responses:
        '200': {description: Access token consumed, content: {application/json: {schema: {$ref: '#/components/schemas/AccessLinkConsumeResponse'}}}}
        '401': {description: Invalid or expired signature, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '409': {description: Token already used or expired, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique key for this logical write (8 to 128 letters, digits, dot, underscore, colon, or hyphen).
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]+$'
  schemas:
    Error:
      type: object
      properties:
        code:
          type: integer
          example: 403
        status:
          type: string
          example: error
        data:
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              items: {}
        message:
          type: string
          example: Forbidden
        request_id:
          type: string
          example: 879c2e5f32fe9a8bdd07845a
        error:
          type: object
          properties:
            type: {type: string, example: forbidden}
            message: {type: string, example: Forbidden}
      required:
        - code
        - status
        - data
        - message
    DependentEligibility:
      type: object
      properties:
        status: {type: string, enum: [active, past_due, expired, cancelled, none]}
        inherited_from_holder: {type: boolean, example: true}
        holder_customer_id: {type: integer}
        status_changed_at: {type: string, nullable: true}
      required: [status, inherited_from_holder, holder_customer_id]
    Dependent:
      type: object
      properties:
        dependent_id: {type: integer}
        holder_customer_id: {type: integer}
        name: {type: string}
        document: {type: string}
        phone: {type: string}
        birth_date: {type: string, format: date, nullable: true}
        identity_document: {type: string}
        country: {type: string}
        eligibility: {$ref: '#/components/schemas/DependentEligibility'}
      required: [dependent_id, holder_customer_id, name, document, eligibility]
    DependentWrite:
      type: object
      properties:
        name: {type: string}
        document: {type: string}
        phone: {type: string}
        birth_date: {type: string, format: date}
        identity_document: {type: string}
        country: {type: string}
      required: [name, document]
    DependentUpdate:
      type: object
      properties:
        name: {type: string}
        phone: {type: string}
        birth_date: {type: string, format: date}
        identity_document: {type: string}
        country: {type: string}
    DependentResponse:
      type: object
      properties:
        code: {type: integer}
        status: {type: string}
        request_id: {type: string}
        data:
          type: object
          properties:
            dependent: {$ref: '#/components/schemas/Dependent'}
      required: [code, status, data]
    ActiveLife:
      type: object
      properties:
        beneficiary_type: {type: string, enum: [holder, dependent]}
        beneficiary_id: {type: integer}
        holder_customer_id: {type: integer}
        name: {type: string}
        document: {type: string}
        plan_id: {type: integer}
        status: {type: string, enum: [active]}
        status_changed_at: {type: string, nullable: true}
      required: [beneficiary_type, beneficiary_id, holder_customer_id, name, plan_id, status]
    ReconciliationResponse:
      type: object
      properties:
        code: {type: integer, example: 200}
        status: {type: string, example: success}
        request_id: {type: string}
        data:
          type: object
          properties:
            total: {type: integer}
            page: {type: integer}
            per_page: {type: integer}
            total_pages: {type: integer}
            items: {type: array, items: {$ref: '#/components/schemas/ActiveLife'}}
      required: [code, status, data]
    WebhookEndpoint:
      type: object
      properties:
        webhook_id: {type: integer}
        url: {type: string, format: uri}
        events: {type: array, items: {type: string, enum: [subscription.activated, subscription.past_due, subscription.expired, subscription.cancelled]}}
        active: {type: boolean}
        created_at: {type: string}
        updated_at: {type: string}
      required: [webhook_id, url, events, active]
    WebhookCreateRequest:
      type: object
      properties:
        url: {type: string, format: uri, pattern: '^https://'}
        events: {type: array, minItems: 1, uniqueItems: true, items: {type: string, enum: [subscription.activated, subscription.past_due, subscription.expired, subscription.cancelled]}}
      required: [url, events]
    WebhookCreateResponse:
      type: object
      properties:
        code: {type: integer, example: 201}
        status: {type: string, example: success}
        data:
          allOf:
            - $ref: '#/components/schemas/WebhookEndpoint'
            - type: object
              properties:
                signing_secret: {type: string, description: Returned only once.}
      required: [code, status, data]
    WebhookListResponse:
      type: object
      properties:
        code: {type: integer}
        status: {type: string}
        data:
          type: object
          properties:
            total: {type: integer}
            items: {type: array, items: {$ref: '#/components/schemas/WebhookEndpoint'}}
      required: [code, status, data]
    WebhookDelivery:
      type: object
      properties:
        delivery_id: {type: integer}
        webhook_id: {type: integer}
        event_id: {type: string, format: uuid}
        event_type: {type: string}
        attempt_count: {type: integer}
        next_attempt_at: {type: string, nullable: true}
        delivered_at: {type: string, nullable: true}
        last_http_status: {type: integer, nullable: true}
        last_error: {type: string, nullable: true}
        created_at: {type: string}
    WebhookDeliveryListResponse:
      type: object
      properties:
        code: {type: integer}
        status: {type: string}
        data:
          type: object
          properties:
            total: {type: integer}
            page: {type: integer}
            per_page: {type: integer}
            total_pages: {type: integer}
            items: {type: array, items: {$ref: '#/components/schemas/WebhookDelivery'}}
    EligibilityHistory:
      type: object
      properties:
        history_id: {type: integer}
        beneficiary_type: {type: string, enum: [holder, dependent]}
        beneficiary_id: {type: integer}
        previous_status: {type: string}
        new_status: {type: string}
        reason: {type: string, nullable: true}
        external_reference: {type: string, nullable: true}
        operator_id: {type: integer}
        changed_at: {type: string}
    EligibilityHistoryListResponse:
      type: object
      properties:
        code: {type: integer}
        status: {type: string}
        data:
          type: object
          properties:
            total: {type: integer}
            page: {type: integer}
            per_page: {type: integer}
            total_pages: {type: integer}
            items: {type: array, items: {$ref: '#/components/schemas/EligibilityHistory'}}
    ProviderLinkResponse:
      type: object
      properties:
        code: {type: integer}
        status: {type: string}
        data:
          type: object
          properties:
            beneficiary_type: {type: string, enum: [holder, dependent]}
            beneficiary_id: {type: integer}
            provider_key: {type: string}
            external_beneficiary_id: {type: string}
      required: [code, status, data]
    AccessLinkRequest:
      type: object
      properties:
        beneficiary_type: {type: string, enum: [holder, dependent]}
        beneficiary_id: {type: integer, minimum: 1}
        provider_key: {type: string}
        expires_in: {type: integer, minimum: 60, maximum: 900, default: 300}
      required: [beneficiary_type, beneficiary_id, provider_key]
    AccessLinkResponse:
      type: object
      properties:
        code: {type: integer, example: 201}
        status: {type: string, example: success}
        data:
          type: object
          properties:
            access_token: {type: string}
            token_type: {type: string, enum: [one_time]}
            expires_in: {type: integer}
            expires_at: {type: string, format: date-time}
      required: [code, status, data]
    AccessLinkConsumeResponse:
      type: object
      properties:
        code: {type: integer, example: 200}
        status: {type: string, example: success}
        data:
          type: object
          properties:
            beneficiary_type: {type: string, enum: [holder, dependent]}
            beneficiary_id: {type: integer}
            provider_key: {type: string}
            external_beneficiary_id: {type: string, nullable: true}
            consumed_at: {type: string}
      required: [code, status, data]
    Plan:
      type: object
      properties:
        plan_id:
          type: integer
