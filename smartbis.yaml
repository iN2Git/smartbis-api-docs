          type: string
          example: Telemedicina Individual
        description:
          type: string
        type:
          type: integer
        setup_fee:
          type: number
          format: float
          example: 0
        prices:
          type: object
          properties:
            monthly: {type: number, format: float}
            semiannual: {type: number, format: float}
            annual: {type: number, format: float}
            lifetime: {type: number, format: float}
        active:
          type: integer
          enum: [0, 1]
      required: [plan_id, name, type, setup_fee, prices, active]
    PlanListResponse:
      type: object
      properties:
        code: {type: integer, example: 200}
        status: {type: string, example: success}
        data:
          type: object
          properties:
            total: {type: integer}
            items:
              type: array
              items:
                $ref: '#/components/schemas/Plan'
      required: [code, status, data]
    Subscription:
      type: object
      properties:
        customer_id: {type: integer}
        customer_name: {type: string}
        document: {type: string}
        phone: {type: string}
        plan_id: {type: integer, nullable: true}
        plan_name: {type: string, nullable: true}
        status:
          type: string
          enum: [active, past_due, expired, cancelled, none]
        renewal_period_months:
          type: integer
          nullable: true
          enum: [0, 1, 6, 12]
        amount: {type: number, format: float, nullable: true}
        payment_method:
          type: string
          nullable: true
          enum: [pix, card, bank_slip]
        contract_until: {type: string, nullable: true, example: '2027-09-24'}
        status_changed_at: {type: string, nullable: true}
        customer_active: {type: integer, enum: [0, 1]}
      required: [customer_id, customer_name, status, customer_active]
    SubscriptionResponse:
      type: object
      properties:
        code: {type: integer, example: 200}
        status: {type: string, example: success}
        data:
          type: object
          properties:
            subscription:
              $ref: '#/components/schemas/Subscription'
      required: [code, status, data]
    SubscriptionListResponse:
      type: object
      properties:
        code: {type: integer, example: 200}
        status: {type: string, example: success}
        data:
          type: object
          properties:
            total: {type: integer}
            page: {type: integer}
            per_page: {type: integer}
            total_pages: {type: integer}
            items:
              type: array
              items:
                $ref: '#/components/schemas/Subscription'
      required: [code, status, data]
    ManageSubscriptionRequest:
      type: object
      description: plan_id and renewal_period_months are required when status is active. contract_until is also required for renewable plans and may be omitted for a lifetime plan (renewal_period_months = 0).
      properties:
        status:
          type: string
          enum: [active, past_due, cancelled, none]
        plan_id: {type: integer}
        renewal_period_months: {type: integer, enum: [0, 1, 6, 12]}
        amount: {type: number, format: float, minimum: 0}
        payment_method: {type: string, enum: [pix, card, bank_slip]}
        contract_until: {type: string, format: date}
        reason: {type: string, maxLength: 255}
        external_reference: {type: string, maxLength: 255}
      required: [status]
    ManageSubscriptionResponse:
      type: object
      properties:
        code: {type: integer, example: 200}
        status: {type: string, example: success}
        data:
          type: object
          properties:
            subscription:
              $ref: '#/components/schemas/Subscription'
            billing_managed: {type: boolean, example: false}
            event:
              type: object
              nullable: true
              description: Event queued atomically with the eligibility history when the status changes.
              properties:
                type:
                  type: string
                  enum: [subscription.activated, subscription.past_due, subscription.cancelled]
                delivery_status: {type: string, enum: [queued, no_subscribers]}
                queued_deliveries: {type: integer, minimum: 0}
        message:
          type: string
          example: Subscription access updated successfully; billing gateways were not changed
      required: [code, status, data, message]
